services:
    postgres:
        image: postgres:latest
        container_name: ticketmallard-postgres
        network_mode: 'host'
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: ticketmallard
        ports:
            - '5432:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d ticketmallard']
            interval: 3s
            timeout: 3s
            retries: 5

    redis:
        image: redis:latest
        container_name: ticketmallard-redis
        network_mode: 'host'
        ports:
            - '6379:6379'
        healthcheck:
            test: ['CMD-SHELL', 'redis-cli', 'ping']
            interval: 3s
            timeout: 3s
            retries: 5

    qstash:
        image: public.ecr.aws/upstash/qstash:latest
        container_name: ticketmallard-qstash
        command: ['qstash', 'dev', '--port', '8099']
        network_mode: 'host'
        ports:
            - '8099:8080'
            - '8100:8081'
