services:
    postgres:
        image: postgres:latest
        container_name: ticketmallard-postgres
        network_mode: 'host'
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: ticketmallard
        ports:
            - '5432:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d ticketmallard']
            interval: 3s
            timeout: 3s
            retries: 5
